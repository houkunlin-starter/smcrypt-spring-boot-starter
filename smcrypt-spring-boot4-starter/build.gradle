plugins {
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.13.1'
    id 'org.jreleaser' version '1.26.0'
    id 'maven-publish'
    id 'signing'
    id 'java-library'
    id 'idea'
}
apply from: rootProject.file("publishing.gradle")

// BouncyCastle 版本（SM9 需 1.86+）；Java 17 使用 jdk18on 坐标
def bouncyCastleVersion = '1.86'

dependencies {
    api project(':smcrypt-spring-boot')
    api "org.bouncycastle:bcprov-jdk18on:${bouncyCastleVersion}"
    api "org.bouncycastle:bcpkix-jdk18on:${bouncyCastleVersion}"
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// 生成的 pom.xml 不导入 spring-boot-dependencies BOM，避免污染使用方自身的 dependencyManagement
dependencyManagement {
    generatedPomCustomization {
        enabled = false
    }
}
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}
bootJar {
    enabled = false
}
java {
    withJavadocJar()
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
jar {
    enabled = true
    setArchiveClassifier("")
}

